services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: books-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: books
      RABBITMQ_DEFAULT_PASS: books
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - books-rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7
    container_name: books-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  books-rabbitdata: